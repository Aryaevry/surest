plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'org.surest'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'com.h2database:h2' // for in-memory testing
    implementation 'org.postgresql:postgresql' // replace with your DB

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    //Flyway
    implementation 'org.flywaydb:flyway-core:11.17.0'

    //validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- Testing (JUnit 5 + Mockito included) ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Optional: explicit Mockito versions
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'

    // Spring Security Test for @WithMockUser
    testImplementation 'org.springframework.security:spring-security-test'

}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "failed", "skipped"
    }

    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80   // Require at least 80% coverage
            }
        }
    }
}


